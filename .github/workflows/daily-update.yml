name: 每日更新文献雷达

on:
  schedule:
    # 北京时间每天 06:00 = UTC 22:00
    - cron: "0 22 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: paper-radar-update
  cancel-in-progress: false

jobs:
  update-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 配置 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: 安装依赖
        run: pip install -r requirements.txt

      - name: 抓取、筛选、总结并生成网站
        run: python -m pipeline run --days 7
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          DEEPSEEK_BASE_URL: ${{ secrets.DEEPSEEK_BASE_URL }}
          DEEPSEEK_MODEL: ${{ secrets.DEEPSEEK_MODEL }}
          OPENALEX_MAILTO: ${{ secrets.OPENALEX_MAILTO }}

      - name: 提交数据更新
        run: |
          git config user.name "paper-radar-bot"
          git config user.email "paper-radar-bot@users.noreply.github.com"
          git add data/papers.json site/data/papers.json
          if git diff --cached --quiet; then
            echo "本次无数据变化"
          else
            git commit -m "chore: 每日文献更新 $(date -u +%Y-%m-%d)"
            git push
          fi

      - name: 上传网站产物
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: 部署到 GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

